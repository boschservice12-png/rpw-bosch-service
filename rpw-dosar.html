var sb=supabase.createClient(SB_URL,SB_KEY);
var JOB=null;
var S={sec:{client:1,auto:1,acte:1,talon:0,docs:0,photos:1,elems:1}};

function gJI(){return new URLSearchParams(location.search).get('job')}
async function loadJob(){
  var jid=gJI();if(!jid){render();return}
  var cached=localStorage.getItem('rpw_job_'+jid);
  if(cached){try{JOB=JSON.parse(cached);if(!JOB.phases)JOB.phases={};for(var p=1;p<=7;p++){if(!JOB.phases[p])JOB.phases[p]={status:"pending"}};render()}catch(e){}}
  try{
    var res=await RPWDb.getRow(sb,jid);
    if(res.error)throw res.error;
    var _lts=0,_sts=0;try{_lts=Date.parse(localStorage.getItem('rpw_job_ts_'+jid)||0)||0;_sts=Date.parse(res.data.updated_at||0)||0}catch(e){}
    if(!(JOB&&_lts&&_sts<=_lts)){JOB=res.data.data;if(JOB&&res.data.version!=null)JOB.version=res.data.version;if(!JOB.phases)JOB.phases={};for(var p=1;p<=7;p++){if(!JOB.phases[p])JOB.phases[p]={status:"pending"}};
    try{localStorage.setItem('rpw_job_'+jid,JSON.stringify(JOB));localStorage.setItem('rpw_job_ts_'+jid,res.data.updated_at||new Date().toISOString())}catch(e){}}
    try{localStorage.setItem('rpw_job_'+jid,JSON.stringify(JOB))}catch(e){}
  }catch(e){if(!JOB)JOB=null}
  render();
}

function _actaCompress(file){
  return new Promise(function(res){
    if(!/^image\//.test(file.type||'')){res(file);return;}
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      var mx=1400,w=img.width,hh=img.height;
      if(w>mx||hh>mx){var r=Math.min(mx/w,mx/hh);w=Math.round(w*r);hh=Math.round(hh*r);}
      var c=document.createElement('canvas');c.width=w;c.height=hh;
      c.getContext('2d').drawImage(img,0,0,w,hh);
      c.toBlob(function(b){URL.revokeObjectURL(url);res(b||file);},'image/jpeg',.72);
    };
    img.onerror=function(){URL.revokeObjectURL(url);res(file);};
    img.src=url;
  });
}

function dlgAsk(o){ o.lang=gL(); if(window.RPWWorkflow&&RPWWorkflow.ask)return RPWWorkflow.ask(o);

window.ddDay=function(off){var d=new Date();d.setDate(d.getDate()+(off||0));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
window.ddDiff=function(a,b){
  var x=new Date(a+'T00:00:00'), y=new Date(b+'T00:00:00');
  return Math.round((y-x)/86400000);
};
window.ddAddWork=function(iso,n){            // n munkanap hozzaadasa
  var d=new Date(iso+'T00:00:00'), left=n;
  while(left>0){ d.setDate(d.getDate()+1); var w=d.getDay(); if(w!==0&&w!==6)left--; }
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
};
window.ddAddDays=function(iso,n){
  var d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
};
window.ddTermene=function(job){
  var p=job&&job.dosarPredat;
  if(!p||!/^\d{4}-\d{2}-\d{2}$/.test(p))return null;
  var azi=ddDay(0);
  var mk=function(key,due){
    var d=ddDiff(azi,due);
    return {key:key,due:due,left:d,cls:(d<0?'dd-late':(d<=3?'dd-warn':'dd-ok'))};
  };
  return {predat:p, tel:ddDiff(p,azi),
          items:[ mk('dd_term_constatare', ddAddWork(p,3)),
                  mk('dd_term_oferta',     ddAddDays(p,30)) ]};
};
window.acteCountFor=function(job){
  var DA=window.RPW_DAUNA_DOCS||[], acte=(job&&job.dosarActe)||{};
  var dd=(job&&(job.flux==='doar_dosar'||(job.flux==null&&job.doarDosar===true)));
  var mod = dd ? 'deschid' : ((job&&job.dosarStatus==='deschis')?'deschis':'deschid');
  var slot=function(k){var a=acte[k];return a?(Array.isArray(a)?a.length:1):0};
  var tot=0,done=0;
  DA.forEach(function(g){
    if(g.optional)return;
    if(g.req && g.req.indexOf(mod)<0)return;
    if(g.either){tot++;if(g.items.some(function(it){return slot(it.key)}))done++;}
    else g.items.forEach(function(it){tot++;if(slot(it.key))done++;});
  });
  if(mod==='deschis'){tot++;if(String((job&&job.nrDosar)||'').trim())done++;}
  return {done:done,total:tot,mod:mod};
};

window.uploadActa=async function(e,key,multi){
  var files=e.target.files;if(!files||!files.length||!JOB)return;
  var BUCKET=RPW_CFG.BUCKET||'rpw-photos';
  if(!JOB.dosarActe)JOB.dosarActe={};
  var cur=JOB.dosarActe[key];var arr=(cur?(Array.isArray(cur)?cur.slice():[cur]):[]);
  if(!multi)arr=[]; // egy-rés: felülír
  toast('Se încarcă…');
  for(var i=0;i<files.length;i++){
    var f=files[i];
    try{
      var blob=await _actaCompress(f);
      var isImg=/^image\//.test(blob.type||f.type||'');
      var ext=isImg?'jpg':(((f.name||'file').split('.').pop())||'bin').toLowerCase();
      var kk='acta_'+key+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
      var path=JOB.id+'/acte/'+kk+'.'+ext;
      var up=await sb.storage.from(BUCKET).upload(path,blob,{contentType:blob.type||f.type||'application/octet-stream',upsert:true});
      if(up.error)throw up.error;
      var url=sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
      arr.push({url:url,path:path,name:f.name||(kk+'.'+ext),type:blob.type||f.type||'',ts:new Date().toISOString(),src:'service'});
    }catch(err){toast('Eroare la fișier: '+(err&&err.message||err),1)}
  }
  JOB.dosarActe[key]=arr;
  var ok=await _saveActe();toast(ok?'✓ Salvat':'Salvare eșuată'+'',!ok);
  render();
};

// ── Export dosar → ZIP a számítógépre (biztosító oldali továbbküldéshez) ──
window.exportDosar=async function(){
  if(!JOB)return;
  if(typeof JSZip==='undefined'){dlgSay({tone:'warn',title:T('dlg_zip_t'),text:T('dlg_zip_s'),okText:T('dlg_ok')});return;}
  var DA=window.RPW_DAUNA_DOCS||[], acte=JOB.dosarActe||{};
  var slotFiles=function(k){var a=acte[k];return a?(Array.isArray(a)?a:[a]):[]};
  var missing=[];
  DA.forEach(function(g){
    if(g.optional)return;
    if(g.either){if(!g.items.some(function(it){return slotFiles(it.key).length}))missing.push(g.label);}
    else g.items.forEach(function(it){if(!slotFiles(it.key).length)missing.push(g.label+' / '+it.label);});
  });
  if(missing.length){
    if(window.RPWWorkflow&&RPWWorkflow.showBlockModal){
      var _c=acteCountFor(JOB);
      RPWWorkflow.showBlockModal({
        lang:gL(), title:T('zip_missing').replace('{n}',missing.length),
        subtitle:(JOB.plate||JOB.number||''), lead:T('zip_lead'),
        items:missing, pct:(_c.total?Math.round(_c.done/_c.total*100):0),
        cancelText:T('zip_cancel'), confirmText:T('zip_go'),
        onConfirm:function(){ exportDosarZip(missing); }
      });
      return;
    }
    dlgAsk({tone:'warn',title:T('zip_missing').replace('{n}',missing.length),text:T('zip_lead'),
      items:missing,cancelText:T('zip_cancel'),confirmText:T('zip_go'),
      onConfirm:function(){ exportDosarZip(missing); }});
    return;
  }
  return exportDosarZip(missing);
};
window.exportDosarZip=async function(missing){
  var DA=window.RPW_DAUNA_DOCS||[], acte=JOB.dosarActe||{};
  var slotFiles=function(k){var a=acte[k];return a?(Array.isArray(a)?a:[a]):[]};
  missing=missing||[];
  toast('Se pregătește arhiva…');
  var sani=function(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'').toLowerCase()};
  var extOf=function(u){var m=(u.url||'').match(/\.(jpg|jpeg|png|webp|pdf)(\?|$)/i);return m?m[1].toLowerCase():((u.type||'').indexOf('pdf')>=0?'pdf':'jpg')};
  var zip=new JSZip();
  var index=['DOSAR DAUNA — '+(JOB.nrDosar||JOB.number||JOB.id),
    'Nr. inmatriculare: '+(JOB.plate||'-'),
    'Proprietar: '+(JOB.proprietar||JOB.client||'-'),
    'Asigurator: '+(JOB.asigurator||'-'),
    'Data export: '+new Date().toLocaleString('ro-RO'),''];
  var n=0,errs=0;
  async function add(folder,base,u){
    try{
      var r=await fetch(u.url);if(!r.ok)throw new Error('HTTP '+r.status);
      var b=await r.blob();
      var name=folder+'/'+base+'.'+extOf(u);
      zip.file(name,b);index.push('OK  '+name);n++;
    }catch(e){errs++;index.push('!!  LIPSA (eroare): '+folder+'/'+base);}
  }
  for(var gi=0;gi<DA.length;gi++){var g=DA[gi];
    var gfolder=('0'+(gi+1)).slice(-2)+'_'+sani(g.label);
    for(var ii=0;ii<g.items.length;ii++){var it=g.items[ii];var fs=slotFiles(it.key);
      for(var fi=0;fi<fs.length;fi++){
        var base=sani(it.label)+(fs.length>1?('_'+(fi+1)):'');
        await add(gfolder,base,fs[fi]);
      }
    }
  }
  var cu=JOB.clientUploads||[];
  for(var ci=0;ci<cu.length;ci++){await add('alte_documente','extra_'+(ci+1),cu[ci]);}
  index.push('','Total fisiere: '+n+(errs?(' · erori: '+errs):''));
  if(missing.length){index.push('','DOCUMENTE LIPSA:');missing.forEach(function(m){index.push('  - '+m)});}
  zip.file('index.txt',index.join('\r\n'));
  try{
    var blob=await zip.generateAsync({type:'blob'});
    var fn='Dosar_'+sani(JOB.nrDosar||JOB.number||JOB.id)+(JOB.plate?('_'+sani(JOB.plate)):'')+'.zip';
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
    toast('✓ Arhivă descărcată'+(errs?(' ('+errs+' erori)'):''));
    // Az atadas pillanata ez — ne kelljen kulon megjelolni.
    var _dd=(JOB.flux==='doar_dosar')||(JOB.flux==null&&JOB.doarDosar===true);
    if(_dd && !JOB.dosarPredat && !JOB.inchis && window.RPWWorkflow && RPWWorkflow.showBlockModal){
      setTimeout(function(){
        RPWWorkflow.showBlockModal({
          lang:gL(), title:T('zip_predat_t'), subtitle:(JOB.plate||JOB.number||''),
          lead:T('zip_predat_q'), items:[fn],
          cancelText:T('zip_predat_no'), confirmText:T('zip_predat_yes'),
          onConfirm:function(){ dosarPredat(); }
        });
      },900);
    }
  }catch(e){toast('Eroare la arhivare: '+(e&&e.message||e),1);}
};
