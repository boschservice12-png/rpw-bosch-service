  var t=document.createElement('div');
  t.className='toast'+(e?' err':'');
  t.textContent=String(m==null?'':m);
  (document.body||document.documentElement).appendChild(t);
  setTimeout(function(){ try{ t.remove() }catch(_){} },3000);
}

function _actaCompress(file){
  return new Promise(function(res){
    if(!/^image\//.test(file.type||'')){res(file);return;}
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      var mx=1400,w=img.width,hh=img.height;
      if(w>mx||hh>mx){var r=Math.min(mx/w,mx/hh);w=Math.round(w*r);hh=Math.round(hh*r);}
      var c=document.createElement('canvas');c.width=w;c.height=hh;
      c.getContext('2d').drawImage(img,0,0,w,hh);
      c.toBlob(function(b){URL.revokeObjectURL(url);res(b||file);},'image/jpeg',.72);
    };
    img.onerror=function(){URL.revokeObjectURL(url);res(file);};
    img.src=url;
  });
}

// A szerver elutasításának megjelenítése — románul, a hiánylistával.
window._dosarHiba=function(res){
  var e = (res && res.error) || {};
  if(res && res.offline){ toast(e.message || 'Fără conexiune.', 1); return; }
  if(e.code === 'requirements_missing' && Array.isArray(e.missing) && e.missing.length){
    toast(e.missing.map(function(m){ return m.message; }).join(' · '), 1); return;
  }
  if(e.code === 'version_conflict'){
    if(window.RPWConflict){
      RPWConflict.show({ jobId:JOB.id, mine:{}, theirs:{},
        serverVersion:e.serverVersion, isPhaseClose:true,
        onReload:function(){ location.reload(); },
        onReapply:function(){ location.reload(); },
        onCancel:function(){} });
    } else { toast(e.message || 'Conflict de date.', 1); }
    return;
  }
  if(e.code === 'not_allowed'){
    toast((e.message || 'Nu ai dreptul.') + (e.need ? ' ('+e.need+')' : ''), 1); return;
  }
  toast(e.message || 'Operațiunea a fost respinsă.', 1);
};

window.ddDay=function(off){var d=new Date();d.setDate(d.getDate()+(off||0));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
window.ddDiff=function(a,b){
  var x=new Date(a+'T00:00:00'), y=new Date(b+'T00:00:00');
  return Math.round((y-x)/86400000);
};
window.ddAddWork=function(iso,n){            // n munkanap hozzaadasa
  var d=new Date(iso+'T00:00:00'), left=n;
  while(left>0){ d.setDate(d.getDate()+1); var w=d.getDay(); if(w!==0&&w!==6)left--; }
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
};
window.ddAddDays=function(iso,n){
  var d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
};
window.ddTermene=function(job){
  var p=job&&job.dosarPredat;
  if(!p||!/^\d{4}-\d{2}-\d{2}$/.test(p))return null;
  var azi=ddDay(0);
  var mk=function(key,due){
    var d=ddDiff(azi,due);
    return {key:key,due:due,left:d,cls:(d<0?'dd-late':(d<=3?'dd-warn':'dd-ok'))};
  };
  return {predat:p, tel:ddDiff(p,azi),
          items:[ mk('dd_term_constatare', ddAddWork(p,3)),
                  mk('dd_term_oferta',     ddAddDays(p,30)) ]};
};
window.acteCountFor=function(job){
  var DA=window.RPW_DAUNA_DOCS||[], acte=(job&&job.dosarActe)||{};
  var dd=(job&&(job.flux==='doar_dosar'||(job.flux==null&&job.doarDosar===true)));
  var mod = dd ? 'deschid' : ((job&&job.dosarStatus==='deschis')?'deschis':'deschid');
  var slot=function(k){var a=acte[k];return a?(Array.isArray(a)?a.length:1):0};
  var tot=0,done=0;
  DA.forEach(function(g){
    if(g.optional)return;
    if(g.req && g.req.indexOf(mod)<0)return;
    if(g.either){tot++;if(g.items.some(function(it){return slot(it.key)}))done++;}
    else g.items.forEach(function(it){tot++;if(slot(it.key))done++;});
  });
  if(mod==='deschis'){tot++;if(String((job&&job.nrDosar)||'').trim())done++;}
  return {done:done,total:tot,mod:mod};
};

// ── DUPLIKATUM-FIGYELMEZTETES (2026-08-25) ──────────────────────────
// KORABBAN az uj-dosszie URLAP blokkolta a masodik azonos esetet:
// ugyanaz a rendszam + ugyanaz a biztosito + ugyanaz a karszam.
// Az urlap 2026-08-25-en kikerult (az Avizare dauna gomb egybol ide
// hoz), es a karszamot MOST ITT adjak meg — ezert a figyelmeztetes is
// ide kerult at. NEM blokkol, mert a dosszie ekkor mar letezik; de
// nem is nemul el, mert a ket azonos dosszie valodi kar.
//
// Egy autonak lehet egyszerre Allianz-kara es Groupama-kara: az KET
// szabalyos eset. Csak az UGYANAZ ketszer a duplikatum.
function _dupPlateKey(x){ return String(x||'').toUpperCase().replace(/[^A-Z0-9]/g,'') }
function _dupCaseKey(asig,nr){
  var a=String(asig||'').trim().toUpperCase(), d=String(nr||'').trim().toUpperCase();
  if(!a && !d) return null;                       // nincs mibol azonositani
  return 'ASIG|'+a+'|'+d;
}
window.dosarDupCheck=async function(){
  if(!JOB) return null;
  var plate=_dupPlateKey(JOB.plate);
  if(!plate) return null;                         // rendszam nelkul nem azonosithato
  var mine=_dupCaseKey(JOB.asigurator, JOB.nrDosar);
  if(!mine) return null;
  var rows=[];
  try{
    var r=await RPWDb.listActive(sb);
    if(r && r.error) return null;                 // offline vagy szerverhiba: csendben
    rows=(r && r.data) || [];
  }catch(e){ return null }
  for(var i=0;i<rows.length;i++){
    var j=(rows[i] && rows[i].data) || rows[i];
    if(!j || j.id===JOB.id) continue;
    if(j.inchis) continue;                        // lezart eset nem szamit
    if(_dupPlateKey(j.plate)!==plate) continue;
    if(_dupCaseKey(j.asigurator, j.nrDosar)!==mine) continue;
    _dupWarn(j);
    return j;
  }
  return null;
};
function _dupWarn(j){

  var prev=document.querySelector('.dup-warn'); if(prev) prev.remove();
  (document.body||document.documentElement).appendChild(box);

// ── EGY FÁJL EGY RÉSBE ──────────────────────────────────────────
// EGYETLEN feltöltési út: a résenkénti gomb és a kötegelt feltöltés
// is ezt hívja. Két út két külön hibát jelentene.
async function _uploadFileToSlot(f,key){
  var BUCKET=RPW_CFG.BUCKET||'rpw-photos';
  var blob=await _actaCompress(f);
  var isImg=/^image\//.test(blob.type||f.type||'');
  var ext=isImg?'jpg':(((f.name||'file').split('.').pop())||'bin').toLowerCase();
  var kk='acta_'+key+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  var path=JOB.id+'/acte/'+kk+'.'+ext;
  var up=await sb.storage.from(BUCKET).upload(path,blob,{contentType:blob.type||f.type||'application/octet-stream',upsert:true});
  if(up.error)throw up.error;
  // P0.6: a bucket PRIVÁT — a publikus URL halott. Aláírt URL kell.
  var url=await RPWPhotos.signedUrl(sb,path,{bucket:BUCKET});
  return {url:url,path:path,name:f.name||(kk+'.'+ext),type:blob.type||f.type||'',ts:new Date().toISOString(),src:'service'};
}

/* ══ KÖTEGELT FELTÖLTÉS — AI-JAVASLAT, EMBERI DÖNTÉS ═══════════════
   A tizenkilenc rés egyesével töltése húsz perc. Itt a kolléga egyszer
   jelöli ki az összes fényképet, a `classify` funkció megnézi őket, és
   MEGJAVASOLJA, melyik résbe valók.

   AMIT EZ SOSEM TESZ: nem tölt fel magától. A javaslat egy LISTA,
   amit ember hagy jóvá. Ugyanaz az elv, mint a GAP-oknál: a rendszer
   kérdez, nem ítél.

   A károsult és a vétkes személyi igazolványa ugyanúgy néz ki — a
   modell nem tudhatja, melyik kié. Ezt nem találgatjuk: a szabad rést
   ajánljuk, és a sor jelöli, hogy a döntés emberé.               */
var BULK={ open:false, busy:false, items:[], done:0, total:0 };

function _blobToDataUrl(b){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){ res(String(r.result||'')) };
    r.onerror=function(){ rej(new Error('read')) };
    r.readAsDataURL(b);
  });
}

window.bulkActe=async function(e){
  var files=e.target.files; if(!files||!files.length||!JOB) return;
  if(BULK.busy) return;
  BULK.items=[]; BULK.busy=true; BULK.done=0; BULK.total=files.length; BULK.open=true;
  for(var i=0;i<files.length;i++){
    BULK.items.push({ file:files[i], name:files[i].name||'', preview:'',
                      res:null, slot:null, suggest:null, low:true, reason:'wait' });
  }
  e.target.value='';                       // ugyanaz a fájl újra kiválasztható
  bulkRender();

  for(var j=0;j<BULK.items.length;j++){
    var it=BULK.items[j];
    try{
      var blob=await _actaCompress(it.file);
      if(/^image\//.test(blob.type||it.file.type||'')){
        it.preview=URL.createObjectURL(blob);
        it.res=await RPWClassify.classifyImage(await _blobToDataUrl(blob));
      }else{
        // PDF-et nem küldünk a képosztályozónak — nem az a dolga.
        it.res={ type:'altceva', confidence:0, label:'PDF' };
      }
    }catch(err){ it.res={ type:'altceva', confidence:0, label:'' }; }
    BULK.done++;
    bulkRender();
  }

  // A tervet EGYBEN számoljuk: így két „talon față" nem ugyanabba a
  // résbe kerül, ahol a második csendben felülírná az elsőt.
  var terv=RPWClassify.plan(BULK.items.map(function(x){ return x.res }), JOB.dosarActe||{});
  terv.forEach(function(t,ix){
    var it=BULK.items[ix];
    it.suggest=t.slot; it.low=t.low; it.reason=t.reason;
    it.slot=t.low?null:t.slot;             // bizonytalanra NEM választunk előre
  });
  BULK.busy=false;
  bulkRender();
};

function _bulkSlotLabel(key){
  var o=RPWClassify.slotOptions().filter(function(x){ return x.key===key })[0];
  return o?(o.group+' / '+o.label):key;
}
function _bulkOccupied(key){
  if(!key) return false;
  if(RPWClassify.isMulti(key)) return false;
  return RPWClassify.filesIn(JOB&&JOB.dosarActe,key).length>0;
}

function bulkRender(){
  var el=document.getElementById('bulkOv');
  if(!BULK.open){ if(el)el.remove(); return; }
  if(!el){ el=document.createElement('div'); el.id='bulkOv'; el.className='bulk-ov'; document.body.appendChild(el); }

  var kesz=BULK.items.filter(function(x){ return x.slot }).length;
  var h='<div class="bulk-bx"><div class="bulk-hd"><div class="bulk-t">'+escH(T('bk_title'))+'</div>';
  h+='<div class="bulk-s">'+escH(BULK.busy?T('bk_working').replace('{n}',BULK.done).replace('{t}',BULK.total):T('bk_lead'))+'</div></div>';
  h+='<div class="bulk-ls">';

  var opts=RPWClassify.slotOptions();
  BULK.items.forEach(function(it,ix){
    h+='<div class="bulk-r">';
    h+=it.preview?('<img class="bulk-th" src="'+escU(it.preview)+'" alt="">'):'<div class="bulk-th"></div>';
    h+='<div style="flex:1;min-width:0">';
    h+='<div class="bulk-nm">'+escH(it.name)+'</div>';
    h+='<select class="bulk-sel" onchange="bulkSet('+ix+',this.value)">';
    h+='<option value="">'+escH(T('bk_skip'))+'</option>';
    var grp='';
    opts.forEach(function(o){
      if(o.group!==grp){ if(grp)h+='</optgroup>'; h+='<optgroup label="'+escA(o.group)+'">'; grp=o.group; }
      h+='<option value="'+escA(o.key)+'"'+(it.slot===o.key?' selected':'')+'>'+escH(o.label)+'</option>';
    });
    if(grp)h+='</optgroup>';
    h+='</select>';

    // A jelvény MEGMONDJA, miért ez a javaslat — vagy miért nincs.
    if(BULK.busy && !it.res){ h+='<span class="bulk-bd bulk-no">'+escH(T('bk_wait'))+'</span>'; }
    else if(it.reason==='ok'){ h+='<span class="bulk-bd bulk-ok">'+escH(T('bk_sure').replace('{p}',Math.round((it.res&&it.res.confidence||0)*100)))+'</span>'; }
    else if(it.reason==='nesigur'){ h+='<span class="bulk-bd bulk-lo">'+escH(T('bk_unsure').replace('{s}',_bulkSlotLabel(it.suggest)))+'</span>'; }
    else if(it.reason==='ocupat'){ h+='<span class="bulk-bd bulk-lo">'+escH(T('bk_taken'))+'</span>'; }
    else { h+='<span class="bulk-bd bulk-no">'+escH(T('bk_unknown'))+'</span>'; }
    if(it.slot && _bulkOccupied(it.slot)) h+=' <span class="bulk-bd bulk-wr">'+escH(T('bk_replace'))+'</span>';
    h+='</div></div>';
  });

  h+='</div><div class="bulk-ft">';
  h+='<button class="bulk-fb bulk-f1" onclick="bulkClose()">'+escH(T('bk_cancel'))+'</button>';
  h+='<button class="bulk-fb bulk-f2"'+(BULK.busy||!kesz?' disabled style="opacity:.45"':'')+' onclick="bulkConfirm()">'+escH(T('bk_go').replace('{n}',kesz))+'</button>';
  h+='</div></div>';
  el.innerHTML=h;
}

window.bulkSet=function(ix,key){
  var it=BULK.items[ix]; if(!it) return;
  it.slot=key||null;
  bulkRender();
};
window.bulkClose=function(){
  BULK.items.forEach(function(it){ if(it.preview){ try{ URL.revokeObjectURL(it.preview) }catch(e){} } });
  BULK.open=false; BULK.items=[]; BULK.busy=false;
  bulkRender();

window.bulkConfirm=async function(){
  if(BULK.busy||!JOB) return;
  var valasztott=BULK.items.filter(function(x){ return x.slot });
  if(!valasztott.length){ toast(T('bk_none'),1); return; }
  BULK.busy=true; bulkRender();
  if(!JOB.dosarActe)JOB.dosarActe={};

  var hiba=0, rendben=0;
  for(var i=0;i<valasztott.length;i++){
    var it=valasztott[i];
    try{
      var multi=RPWClassify.isMulti(it.slot);
      var cur=JOB.dosarActe[it.slot];
      var arr=(cur?(Array.isArray(cur)?cur.slice():[cur]):[]);
      if(!multi)arr=[];                       // egy-rés: felülír (a sor jelezte)
      arr.push(await _uploadFileToSlot(it.file,it.slot));
      JOB.dosarActe[it.slot]=arr;
      rendben++;
    }catch(err){ hiba++; }
  }
  var ok=await _saveActe();
  BULK.busy=false;
  bulkClose();
  toast(ok?T('bk_done').replace('{n}',rendben)+(hiba?(' · '+T('bk_err').replace('{n}',hiba)):'')
         :T('bk_savefail'), !ok||!!hiba);
  render();
};

// ── Export dosar → ZIP a számítógépre (biztosító oldali továbbküldéshez) ──
window.exportDosar=async function(){
  if(!JOB)return;
  if(typeof JSZip==='undefined'){dlgSay({tone:'warn',title:T('dlg_zip_t'),text:T('dlg_zip_s'),okText:T('dlg_ok')});return;}
  var DA=window.RPW_DAUNA_DOCS||[], acte=JOB.dosarActe||{};
  var slotFiles=function(k){var a=acte[k];return a?(Array.isArray(a)?a:[a]):[]};
  var missing=[];
  DA.forEach(function(g){
    if(g.optional)return;
    if(g.either){if(!g.items.some(function(it){return slotFiles(it.key).length}))missing.push(g.label);}
    else g.items.forEach(function(it){if(!slotFiles(it.key).length)missing.push(g.label+' / '+it.label);});
  });
  if(missing.length){
    if(window.RPWWorkflow&&RPWWorkflow.showBlockModal){
      var _c=acteCountFor(JOB);
      RPWWorkflow.showBlockModal({
        lang:gL(), title:T('zip_missing').replace('{n}',missing.length),
        subtitle:(JOB.plate||JOB.number||''), lead:T('zip_lead'),
        items:missing, pct:(_c.total?Math.round(_c.done/_c.total*100):0),
        cancelText:T('zip_cancel'), confirmText:T('zip_go'),
        onConfirm:function(){ exportDosarZip(missing); }
      });
      return;
    }
    dlgAsk({tone:'warn',title:T('zip_missing').replace('{n}',missing.length),text:T('zip_lead'),
      items:missing,cancelText:T('zip_cancel'),confirmText:T('zip_go'),
      onConfirm:function(){ exportDosarZip(missing); }});
    return;
  }
  return exportDosarZip(missing);
};
window.exportDosarZip=async function(missing){
  var DA=window.RPW_DAUNA_DOCS||[], acte=JOB.dosarActe||{};
  var slotFiles=function(k){var a=acte[k];return a?(Array.isArray(a)?a:[a]):[]};
  missing=missing||[];
  toast('Se pregătește arhiva…');
  var sani=function(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'').toLowerCase()};
  var extOf=function(u){var m=(u.url||'').match(/\.(jpg|jpeg|png|webp|pdf)(\?|$)/i);return m?m[1].toLowerCase():((u.type||'').indexOf('pdf')>=0?'pdf':'jpg')};
  var zip=new JSZip();
  var index=['DOSAR DAUNA — '+(JOB.nrDosar||JOB.number||JOB.id),
    'Nr. inmatriculare: '+(JOB.plate||'-'),
    'Proprietar: '+(JOB.proprietar||JOB.client||'-'),
    'Asigurator: '+(JOB.asigurator||'-'),
    'Data export: '+new Date().toLocaleString('ro-RO'),''];
  var n=0,errs=0;
  async function add(folder,base,u){
    try{
      var r=await fetch(u.url);if(!r.ok)throw new Error('HTTP '+r.status);
      var b=await r.blob();
      var name=folder+'/'+base+'.'+extOf(u);
      zip.file(name,b);index.push('OK  '+name);n++;
    }catch(e){errs++;index.push('!!  LIPSA (eroare): '+folder+'/'+base);}
  }
  for(var gi=0;gi<DA.length;gi++){var g=DA[gi];
    var gfolder=('0'+(gi+1)).slice(-2)+'_'+sani(g.label);
    for(var ii=0;ii<g.items.length;ii++){var it=g.items[ii];var fs=slotFiles(it.key);
      for(var fi=0;fi<fs.length;fi++){
        var base=sani(it.label)+(fs.length>1?('_'+(fi+1)):'');
        await add(gfolder,base,fs[fi]);
      }
    }
  }
  var cu=JOB.clientUploads||[];
  for(var ci=0;ci<cu.length;ci++){await add('alte_documente','extra_'+(ci+1),cu[ci]);}
  index.push('','Total fisiere: '+n+(errs?(' · erori: '+errs):''));
  if(missing.length){index.push('','DOCUMENTE LIPSA:');missing.forEach(function(m){index.push('  - '+m)});}
  zip.file('index.txt',index.join('\r\n'));
  try{
    var blob=await zip.generateAsync({type:'blob'});
    var fn='Dosar_'+sani(JOB.nrDosar||JOB.number||JOB.id)+(JOB.plate?('_'+sani(JOB.plate)):'')+'.zip';
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
    toast('✓ Arhivă descărcată'+(errs?(' ('+errs+' erori)'):''));
    // Az atadas pillanata ez — ne kelljen kulon megjelolni.
    var _dd=(JOB.flux==='doar_dosar')||(JOB.flux==null&&JOB.doarDosar===true);
    if(_dd && !JOB.dosarPredat && !JOB.inchis && window.RPWWorkflow && RPWWorkflow.showBlockModal){
      setTimeout(function(){
        RPWWorkflow.showBlockModal({
          lang:gL(), title:T('zip_predat_t'), subtitle:(JOB.plate||JOB.number||''),
          lead:T('zip_predat_q'), items:[fn],
          cancelText:T('zip_predat_no'), confirmText:T('zip_predat_yes'),
          onConfirm:function(){ dosarPredat(); }
        });
      },900);
    }
  }catch(e){toast('Eroare la arhivare: '+(e&&e.message||e),1);}
};
loadJob();
