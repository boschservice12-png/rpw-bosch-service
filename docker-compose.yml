# RPW — helyi kipróbálás:  docker compose up --build   →  http://localhost:8000/rpw-login.html
# Leállítás: Ctrl+C · Újrakezdés tiszta adattal: docker compose down -v
# Rögzített projektnév: a mappa átnevezése / új ZIP után is UGYANAZ az adatkötet (rpw_rpw-data) — az adat megmarad.
name: rpw
services:
  rpw:
    build: .
    image: rpw-local
    ports:
      - "8000:8000"
    volumes:
      - rpw-data:/data          # adatbázis + fotók + titkok — megmarad újraindításkor
    environment:
      # opcionális: OCR / iratbesorolás és levélküldés (üresen a funkció "nincs beállítva")
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # mintacsapat ismert PIN-ekkel: CSAK helyi próbához (RPW_DEMO=1) — alapból ki
      RPW_DEMO: ${RPW_DEMO:-0}
    restart: unless-stopped
volumes:
  rpw-data:
