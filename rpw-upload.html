<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Încărcare documente — RedAssistance</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<script>/* ── P0.1 (2026-08-23) — SZÁNDÉKOSAN NINCS PIN-ŐR ────────────────
   Ezt az oldalt az ÜGYFÉL nyitja meg a WhatsApp-linkről; nincs dolgozói
   PIN-je. A hozzáférést a linkben lévő munkaazonosító adja, nem a guard.
   MEGJEGYZÉS: ez ma kitalálható azonosítóval megkerülhető — a P0.6
   (privát storage) és egy külön feltöltő-token oldja meg véglegesen. */</script>
<script src="rpw-config.js"></script>
<script>/* ── RPW-002 (2026-08-29) — EZ NYILVANOS UGYFEL-LAP ──────────────
   Az RPW-001 adatreteg-zara munkamenet nelkul MINDEN olvasast es irast
   megtilt. Ez a lap viszont SZANDEKOSAN PIN nelkuli: az ugyfel nyitja meg
   a WhatsApp-linkrol. Enelkul a nyilatkozat nelkul az AUTH_REQUIRED=true
   bekapcsolasa NEMAN megbenitana a teljes ugyfel-feltoltest.
   A hozzaferest a linkben levo munkaazonosito adja — lasd a P0.1 jegyzetet. */
window.RPW_PUBLIC_PAGE = true;</script>
<script src="rpw-guard.js"></script>
<script src="rpw-util.js"></script>
<script>window.escH=window.escH||(window.RPWUtil?RPWUtil.esc:function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})});window.escA=window.escH;window.escU=window.escU||(window.RPWUtil?RPWUtil.escUrl:window.escH);</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="rpw-auth.js"></script>
<script src="rpw-db.js"></script>
<script src="rpw-queue.js"></script><!-- 2026-08-25: tartos offline sor -->
<script src="rpw-data.js"></script><!-- v4: szerveroldali átmenetek -->
<script src="rpw-photos.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f3f4f6;color:#1f2937;line-height:1.5;padding:16px;max-width:560px;margin:0 auto}
.hdr{background:#E11D2E;color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:14px}
.hdr .brand{font-size:13px;font-weight:800;letter-spacing:.02em}.hdr .brand span{opacity:.85;font-weight:600}
.hdr .sub{font-size:12px;opacity:.9;margin-top:2px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin-bottom:12px}
.veh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.plate{font-family:ui-monospace,monospace;font-weight:800;font-size:20px;background:#111;color:#fff;padding:4px 10px;border-radius:6px}
.muted{color:#6b7280;font-size:13px}
h2{font-size:15px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.prog{font-size:12px;font-weight:800;color:#fff;background:#E11D2E;border-radius:12px;padding:2px 10px;margin-left:auto}
.prog.ok{background:#1E9D55}
.grp{border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;margin-bottom:10px}
.grp-h{background:#f9fafb;padding:8px 12px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.grp-or{font-size:10px;font-weight:600;color:#2563eb}
.grp-s{margin-left:auto;width:20px;height:20px;border-radius:50%;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.gs-ok{background:#dcfce7;color:#16a34a}.gs-nd{background:#fef9c3;color:#ca8a04}
.row{padding:7px 12px;border-top:1px solid #f0f1f3}
.up{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1.5px dashed #cbd5e1;border-radius:10px;cursor:pointer;background:#fff;position:relative}
.up:active{background:#f8fafc}
.up.ok{border-style:solid;border-color:#1E9D55;background:#f0fdf4}
.up .lbl{font-size:13px;font-weight:700}
.up.ok .lbl{color:#16a34a}
.up:not(.ok) .lbl::before{content:'➕ ';color:#E11D2E}
.up input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.th{position:relative;aspect-ratio:1;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;background:#eef2f7;display:flex;align-items:center;justify-content:center}
.th img{width:100%;height:100%;object-fit:cover}
.th .doc{font-size:10px;font-weight:800;color:#E11D2E}
.th .ok{position:absolute;top:3px;right:3px;background:#1E9D55;color:#fff;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.drop{display:block;border:2px dashed #E11D2E;border-radius:12px;background:#fff5f6;padding:18px 14px;text-align:center;cursor:pointer;position:relative}
.drop b{color:#E11D2E;font-size:14px}
.drop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.list{margin-top:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:700;z-index:99;max-width:90%}
.toast.err{background:#E11D2E}
.done{text-align:center;color:#1E9D55;font-weight:800;font-size:13px;margin-top:8px}
.sendbar{position:sticky;bottom:0;background:#f3f4f6;padding:12px 0 4px;margin-top:4px}
.send{display:block;width:100%;border:0;border-radius:14px;padding:16px;font:800 17px inherit;
  background:#E11D2E;color:#fff;cursor:pointer}
.send:active{background:#b3141f}
.send.warn{background:#fff;color:#E11D2E;border:2px solid #E11D2E}
.sent{text-align:center;background:#e7f6ec;color:#1E9D55;border:1px solid #86efac;
  border-radius:14px;padding:16px;font:800 17px inherit}
.loading{text-align:center;padding:40px 16px;color:#6b7280}
</style>
</head>
<body>
<div id="app"><div class="loading">Se încarcă…</div></div>
<script>
(function(){
  var app=document.getElementById('app');
  var CFG=window.RPW_CFG;
  function toast(m,e){var t=document.createElement('div');t.className='toast'+(e?' err':'');t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},3000);}
  if(!CFG||!CFG.SB_URL){app.innerHTML='<div class="card">Eroare de configurare. Deschideți linkul primit prin WhatsApp pe telefon.</div>';return;}
  var sb=supabase.createClient(CFG.SB_URL,CFG.SB_KEY);
try{ if(window.RPWData) RPWData.init(sb, {onSync:(typeof onSyncState==='function'?onSyncState:null)}); }catch(e){ console.warn('RPWData init:', e); }

// ── 11 (v4) — A SZERVERT MEGKÉRDEZZÜK, MIELŐTT ADATOT TÖLTENÉNK ──
// Enélkül versenyhelyzet állna elő: az oldal már dolgozna az adattal,
// mire kiderül, hogy a szerver verziója nem megfelelő.
// PRODUCTION módban a hiba MEGÁLLÍTJA az alkalmazást (fail-closed).
window.__rpwServerReady = (async function(){
  try{
    if(!window.RPWGuard || !RPWGuard.verifyServer) return {ok:true, skipped:true};
    return await RPWGuard.verifyServer(sb, window.RPW_CFG);
  }catch(e){ return {ok:false, problems:['verify_threw'], error:e}; }
})();
  var BUCKET=CFG.BUCKET||'rpw-photos';
  var DA=window.RPW_DAUNA_DOCS||[];
  var jid=new URLSearchParams(location.search).get('job');
  var JOB=null, uploads=[], acte={};

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function slotFiles(k){var a=acte[k];return a?(Array.isArray(a)?a:[a]):[]}
  // Hany fajl van MOST a dossziéban. A render es a Trimite gomb ugyanezt
  // szamolja, kulonben az "uj fajl a kuldes ota" merleg elcsuszna.
  function fajlDb(){var n=uploads.length;
    for(var k in acte){if(!Object.prototype.hasOwnProperty.call(acte,k))continue;
      var a=acte[k];n+=(Array.isArray(a)?a.length:(a?1:0));}
    return n;}
  function isImg(u){return /\.(jpg|jpeg|png|webp)(\?|$)/i.test(u.url||'')||(u.type||'').indexOf('image')===0}

  async function load(){
  try{ if(window.__rpwServerReady) await window.__rpwServerReady; }catch(e){}
    if(!jid){app.innerHTML='<div class="card">Link invalid (lipsă dosar).</div>';return;}
    try{
      var res=await RPWDb.getRow(sb,jid,'id,data');
      if(res.error||!res.data){app.innerHTML='<div class="card">Dosarul nu a fost găsit. Verificați linkul.</div>';return;}
      JOB=res.data.data||{}; JOB.id=jid;
      uploads=(JOB.clientUploads||[]).slice();
      acte=JOB.dosarActe||{};
      render();
    }catch(e){app.innerHTML='<div class="card">Eroare de conexiune. Încercați din nou.</div>';}
  }

  function render(){
    var plate=esc(JOB.plate||''), brand=esc(JOB.brand||JOB.auto||''), nr=esc(JOB.number||JOB.id||'');
    var reqTotal=0,reqDone=0;
    DA.forEach(function(g){
      if(g.either){reqTotal++;if(g.items.some(function(it){return slotFiles(it.key).length}))reqDone++;}
      else g.items.forEach(function(it){reqTotal++;if(slotFiles(it.key).length)reqDone++;});
    });
    var allOk=reqDone>=reqTotal;

    var h='';
    h+='<div class="hdr"><div class="brand"><span>Red</span>Assistance · SC Szkaliczki Service</div><div class="sub">Încărcare poze și documente pentru dosar daună</div></div>';
    // ── AZ ELOLAP (Ferenc, 2026-08-27: "hibas az elolapja") ────────
    // Frissen felvett dosszienal meg nincs se rendszam, se marka. Eddig
    // ilyenkor a szo szerinti "Autovehicul" allt a kartyan — az ugyfel
    // egy ures, semmitmondo fejlecet latott. Mostantol a DOSSZIESZAM a
    // focim, es a kartya megmondja, mit kerunk tole.
    var cim = brand || nr;
    h+='<div class="card"><div class="veh">'
      +(plate?'<span class="plate">'+escH(plate)+'</span>':'')
      +'<div><div style="font-weight:800;font-size:17px">'+escH(cim)+'</div>'
      +'<div class="muted">'+(cim===nr?'Dosar de daună':'Dosar: '+escH(nr))+'</div></div></div>'
      +'<div class="muted" style="margin-top:10px;padding-top:10px;border-top:1px solid #e5e7eb">'
      +'Adăugați pozele și actele cerute mai jos. Se salvează automat, unul câte unul. '
      +'La final apăsați butonul <b>Trimite</b>.</div></div>';

    // Structured required documents
    h+='<div class="card"><h2>📋 Documente necesare <span class="prog'+(allOk?' ok':'')+'">'+reqDone+'/'+reqTotal+'</span></h2><div class="muted" style="margin-bottom:10px">Apăsați pe fiecare rând și alegeți poza sau documentul.</div>';
    DA.forEach(function(g){
      var gDone=g.either?g.items.some(function(it){return slotFiles(it.key).length}):g.items.every(function(it){return slotFiles(it.key).length});
      h+='<div class="grp"><div class="grp-h">'+esc(g.label)+(g.either?' <span class="grp-or">(unul dintre)</span>':'')+'<span class="grp-s '+(gDone?'gs-ok':'gs-nd')+'">'+(gDone?'✓':'…')+'</span></div>';
      g.items.forEach(function(it){
        var fs=slotFiles(it.key),has=fs.length;
        h+='<div class="row"><label class="up '+(has?'ok':'')+'"><span class="lbl">'+esc(it.label)+(it.multi&&has?' ('+has+')':'')+'</span><input type="file" accept="image/*,application/pdf"'+(it.multi?' multiple':'')+' onchange="window.__acta(event,\''+it.key+'\','+(it.multi?'1':'0')+')"></label>';
        if(has){h+='<div class="thumbs">';fs.forEach(function(u){h+='<div class="th">'+(isImg(u)?'<img src="'+esc(u.url)+'" data-rpw-path="'+esc(u.path||'')+'">':'<span class="doc">📄 PDF</span>')+'<span class="ok">✓</span></div>';});h+='</div>';}
        h+='</div>';
      });
      h+='</div>';
    });
    // Ferenc, 2026-08-27: "a kuldes ne legyen automatikus". Ez a sor eddig
    // azt allitotta, hogy a papirok "au fost trimise" — pedig csak FELTOLTVE
    // voltak. Az ugyfel ezert azt hitte, mar elment, es nem nyomta meg a gombot.
    if(allOk)h+='<div class="done">✓ Toate documentele necesare sunt încărcate. Apăsați butonul Trimite de mai jos.</div>';
    h+='</div>';

    // Generic extra files
    h+='<div class="card"><h2>📎 Alte fișiere (opțional)</h2>';
    h+='<label class="drop"><b>➕ Adaugă alte poze / documente</b><div class="muted" style="margin-top:4px">Orice altceva util pentru reparație</div><input type="file" accept="image/*,application/pdf" multiple onchange="window.__up(event)"></label>';
    if(uploads.length){
      h+='<div class="list">';
      for(var i=0;i<uploads.length;i++){var u=uploads[i];
        h+='<div class="th" style="aspect-ratio:1">'+(isImg(u)?'<img src="'+esc(u.url)+'" data-rpw-path="'+esc(u.path||'')+'"/>':'<span class="doc">📄</span>')+'<span class="ok">✓</span></div>';}
      h+='</div>';
    }
    h+='</div>';

    // ── A "TRIMITE" GOMB (Ferenc, 2026-08-27: "nincs trimite gomb") ─
    // A fajlok kivalasztaskor azonnal mentodnek — de az ugyfelnek eddig
    // NEM volt egy pillanat, amikor kimondhatta: kesz vagyok. Ez a gomb
    // nem tolt fel ujra semmit; azt rogziti, hogy az ugyfel lezarta, es
    // visszaigazolast ad neki.
    // Ferenc, 2026-08-27: "miutan feltelt minden kep 18/18 plusz extra kepek,
    // maradjon trimite". Ha kuldes UTAN uj fajl kerul fel, a gomb VISSZAJON —
    // kulonben az uj kepekrol a szerviz sosem kapna jelzest.
    var most_db  = fajlDb();
    var kuldve   = !!(JOB.clientGata && JOB.clientGata.at);
    var kuldott  = (JOB.clientGata && JOB.clientGata.files)||0;
    var ujFajl   = kuldve && most_db > kuldott;
    h+='<div class="sendbar">';
    if(kuldve){
      h+='<div class="sent">&#10003; Trimis. Vă mulțumim!</div>';
      if(ujFajl){
        h+='<div class="muted" style="text-align:center;margin:6px 0">'
          +'Ați adăugat '+(most_db-kuldott)+' fișier(e) după trimitere.</div>'
          +'<button type="button" class="send warn" onclick="window.__gata()">'
          +'&#128228; Trimite fișierele noi ('+(most_db-kuldott)+')</button>';
      }else{
        h+='<div class="muted" style="text-align:center;margin-top:4px">'
          +'Puteți adăuga în continuare fișiere — se salvează automat.</div>';
      }
    }else{
      h+='<button type="button" class="send'+(allOk?'':' warn')+'" onclick="window.__gata()">'
        +(allOk?'&#128228; Trimite dosarul':'&#128228; Trimite ('+reqDone+'/'+reqTotal+')')
        +'</button>';
      if(!allOk)h+='<div class="muted" style="text-align:center;margin-top:6px">'
        +'Mai lipsesc '+(reqTotal-reqDone)+' documente — puteți trimite și așa.</div>';
    }
    h+='</div>';

    app.innerHTML=h;
    try{ if(window.RPWPhotos) RPWPhotos.hydrate(sb); }catch(e){}
  }

  function compress(file){
    return new Promise(function(res){
      if(!/^image\//.test(file.type||'')){res(file);return;}
      var img=new Image(),url=URL.createObjectURL(file);
      img.onload=function(){
        var mx=1400,w=img.width,hh=img.height;
        if(w>mx||hh>mx){var r=Math.min(mx/w,mx/hh);w=Math.round(w*r);hh=Math.round(hh*r);}
        var c=document.createElement('canvas');c.width=w;c.height=hh;
        c.getContext('2d').drawImage(img,0,0,w,hh);
        c.toBlob(function(b){URL.revokeObjectURL(url);res(b||file);},'image/jpeg',.72);
      };
      img.onerror=function(){URL.revokeObjectURL(url);res(file);};
      img.src=url;
    });
  }

  async function put(file,prefix){
    var blob=await compress(file);
    var isI=/^image\//.test(blob.type||file.type||'');
    var ext=isI?'jpg':(((file.name||'file').split('.').pop())||'bin').toLowerCase();
    var key=prefix+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
    var path=JOB.id+'/'+key+'.'+ext;
    var up=await sb.storage.from(BUCKET).upload(path,blob,{contentType:blob.type||file.type||'application/octet-stream',upsert:true});
    if(up.error)throw up.error;
    // P0.6: a bucket PRIVÁT — a publikus URL halott. Aláírt URL kell.
    var url=await RPWPhotos.signedUrl(sb,path,{bucket:BUCKET});
    return {key:key,path:path,url:url,name:file.name||(key+'.'+ext),type:blob.type||file.type||'',ts:new Date().toISOString(),src:'whatsapp'};
  }

  window.__acta=async function(e,slot,multi){
    var files=e.target.files;if(!files||!files.length)return;
    toast('Se încarcă…');
    var cur=acte[slot];var arr=(cur?(Array.isArray(cur)?cur.slice():[cur]):[]);
    if(!multi)arr=[];
    for(var i=0;i<files.length;i++){
      try{arr.push(await put(files[i],'acta_'+slot));}
      catch(err){toast('Eroare la un fișier: '+(err&&err.message||err),1);}
    }
    acte[slot]=arr;JOB.dosarActe=acte;
    // NEM "Trimis": ez csak mentes. A kuldes a Trimite gomb.
    try{await RPWDb.patchV2(sb,JOB.id,{dosarActe:acte},{actor:'client_whatsapp'});toast('✓ Fișier încărcat');}
    catch(err){toast('Fișier urcat, salvare eșuată. Reîncercați.',1);}
    render();
  };

  // Az ugyfel kimondja: kesz. Uj fajl NEM megy fel — a jelzes megy.
  window.__gata=async function(){
    var most=new Date().toISOString();
    var elozo=JOB.clientGata;
    JOB.clientGata={at:most,files:fajlDb()};
    render();                                  // azonnal lathato visszajelzes
    try{ await RPWDb.patchV2(sb,JOB.id,{clientGata:JOB.clientGata},{actor:'client_whatsapp'});
         toast('\u2713 Trimis'); }
    catch(err){ toast('Trimiterea nu s-a salvat. Încercați din nou.',1);
                JOB.clientGata=elozo||null; render(); }
  };

  window.__up=async function(e){
    var files=e.target.files; if(!files||!files.length)return;
    toast('Se încarcă…');
    for(var i=0;i<files.length;i++){
      try{uploads.push(await put(files[i],'client'));}
      catch(err){toast('Eroare la un fișier: '+(err&&err.message||err),1);}
    }
    JOB.clientUploads=uploads;
    try{await RPWDb.patchV2(sb,JOB.id,{clientUploads:uploads},{actor:'client_whatsapp'});toast('✓ Fișiere încărcate');}
    catch(err){toast('Fișiere urcate, dar salvare eșuată. Reîncercați.',1);}
    render();
  };

  load();
})();
</script>
</body>
</html>
