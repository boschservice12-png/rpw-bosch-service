function rpwSyncLabel(st){var m={saving_local:['Salvare…','#6B7280'],syncing:['Sincronizare…','#2A6FDB'],synced:['✓ Salvat pe server','#1E9D55'],offline:['⚠ Offline – salvat local','#A6701F'],retry:['↻ Reîncercare…','#A6701F'],failed:['✗ Eșec salvare – reîncearcă','#C81E33'],permission:['✗ Fără permisiune','#C81E33'],conflict:['⚠ Conflict de date','#C81E33'],auth:['✗ Autentificare','#C81E33'],idle:['','#6B7280']};return m[st]||[st,'#6B7280'];}
function onSyncState(st){var el=document.getElementById('rpw-sync');if(el){var l=rpwSyncLabel(st);el.textContent=l[0];el.style.color=l[1];el.style.opacity=l[0]?'1':'0';if(st==='synced'){setTimeout(function(){if(el&&el.textContent===l[0])el.style.opacity='0'},2000)}}var cb=document.getElementById('rpw-conflict');if(st==='conflict'){if(!cb){cb=document.createElement('div');cb.id='rpw-conflict';cb.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,Arial';cb.innerHTML='<div style="max-width:360px;background:#fff;border-radius:12px;padding:22px;text-align:center"><div style="font-size:34px">\u26A0\uFE0F</div><div style="font-size:17px;font-weight:800;color:#C81E33;margin:8px 0">Conflict de date</div><div style="font-size:13px;color:#3F4956;line-height:1.6">Alt utilizator a modificat aceast\u0103 fi\u0219\u0103. Modificarea ta local\u0103 este p\u0103strat\u0103. Re\u00EEncarc\u0103 pentru versiunea de pe server.</div><button onclick="location.reload()" style="margin-top:16px;background:#E11D2E;color:#fff;border:none;border-radius:9px;padding:11px 20px;font-weight:800;cursor:pointer">Re\u00EEncarc\u0103</button></div>';document.body.appendChild(cb);}}else if(cb){cb.remove();}}
var SAVER=(window.RPWSave&&RPWSave.createSaver)?RPWSave.createSaver({sb:sb,onState:onSyncState}):null;

function gJI(){return new URLSearchParams(location.search).get('job')}
async function loadJob(){
  var jid=gJI();if(!jid){render();return}
  var cached=localStorage.getItem('rpw_job_'+jid);
  if(cached){try{JOB=JSON.parse(cached);if(!JOB.phases)JOB.phases={};for(var p=1;p<=7;p++){if(!JOB.phases[p])JOB.phases[p]={status:"pending"}};if(!JOB.controlChecks)JOB.controlChecks={};render()}catch(e){}}
  try{
    var res=await RPWDb.getRow(sb,jid);
    if(res.error)throw res.error;
    var _lts=0,_sts=0;try{_lts=Date.parse(localStorage.getItem('rpw_job_ts_'+jid)||0)||0;_sts=Date.parse(res.data.updated_at||0)||0}catch(e){}
    if(!(JOB&&_lts&&_sts<=_lts)){JOB=res.data.data;if(JOB&&res.data.version!=null)JOB.version=res.data.version;if(!JOB.phases)JOB.phases={};for(var p=1;p<=7;p++){if(!JOB.phases[p])JOB.phases[p]={status:"pending"}};if(!JOB.controlChecks)JOB.controlChecks={};
    try{localStorage.setItem('rpw_job_'+jid,JSON.stringify(JOB));localStorage.setItem('rpw_job_ts_'+jid,res.data.updated_at||new Date().toISOString())}catch(e){}}
    try{localStorage.setItem('rpw_job_'+jid,JSON.stringify(JOB))}catch(e){}
    /* nincs auto-mentes betolteskor */
  }catch(e){if(!JOB)JOB=null}
  render();
}
async function saveJ(){
  if(!JOB)return;
  if(SAVER)return SAVER.save(JOB);              // PHASE 1: valódi Promise + látható állapot + offline sor
  // fallback, ha a mentőmodul nem töltött be — DE most már ellenőrizzük az {error}-t (#2)
  try{localStorage.setItem('rpw_job_'+JOB.id,JSON.stringify(JOB));localStorage.setItem('rpw_job_ts_'+JOB.id,new Date().toISOString())}catch(e){}
  try{var r=await RPWDb.patch(sb,JOB);if(r&&r.error){onSyncState('failed');console.error('Save error:',r.error);return{failed:true,error:r.error}} onSyncState('synced');return{ok:true}}
  catch(e){onSyncState('failed');console.error('Save:',e);return{failed:true,error:e}}
}

];
var SHELL_CUR=5;
function shellVariant(){try{return localStorage.getItem('rpw_shell_v')||'A'}catch(e){return 'A'}}
window.setShellVariant=function(v){try{localStorage.setItem('rpw_shell_v',v)}catch(e){}render()};
window.goPhase=function(i){if(i===SHELL_CUR)return;location.assign(SHELL_PHASES[i].page+'?job='+(JOB?JOB.id:''))};
function shellHtml(job,ln){
  var v=shellVariant();var plate=job.plate||job.number||job.id||'';var cur=SHELL_PHASES[SHELL_CUR];
  function nm(p){return p[ln]||p.ro}
  var h='<div class="shell no-print"><div class="shell-top">';
  h+='<div class="sh-left"><div class="sh-back" onclick="location.assign(\'rpw-dosar.html?job='+job.id+'\')"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></div>';
  h+='<span class="sh-plate">'+escH(plate)+'</span>';
  h+='<div class="sh-phase"><span class="ph-idx">'+cur.n+'</span>'+nm(cur)+'</div></div>';
  h+='<div class="sh-right"><div class="lsw">';
  ['A','B','C'].forEach(function(x){h+='<button class="lb '+(v===x?'on':'')+'" onclick="setShellVariant(\''+x+'\')">'+x+'</button>'});
  h+='</div><div class="lsw"><button class="lb '+(ln==='ro'?'on':'')+'" onclick="sL(\'ro\')">RO</button><button class="lb '+(ln==='en'?'on':'')+'" onclick="sL(\'en\')">EN</button><button class="lb '+(ln==='hu'?'on':'')+'" onclick="sL(\'hu\')">HU</button></div></div></div>';
  if(v==='A'){h+='<div class="stepA">';SHELL_PHASES.forEach(function(p,ix){if(p.page.indexOf('reconstatare')>=0&&job.damageType==='auto')return;var cls=ix<SHELL_CUR?'done':ix===SHELL_CUR?'cur':'';h+='<div class="stA '+cls+'" onclick="goPhase('+ix+')"><span class="n">'+p.n+'</span>'+nm(p)+'</div>'});h+='</div>';}
  else if(v==='B'){h+='<div class="stepB">';SHELL_PHASES.forEach(function(p,ix){if(p.page.indexOf('reconstatare')>=0&&job.damageType==='auto')return;if(ix>0)h+='<div class="stB-line'+(ix<=SHELL_CUR?' done':'')+'"></div>';var cls=ix<SHELL_CUR?' done':ix===SHELL_CUR?' cur':'';h+='<div class="stB'+cls+'" onclick="goPhase('+ix+')" title="'+p.n+' '+nm(p)+'">'+p.n+'</div>';});h+='<span class="stB-name">'+nm(cur)+'</span></div>';}
  else{h+='<div class="stepC"><div class="stepC-bar">';SHELL_PHASES.forEach(function(p,ix){if(p.page.indexOf('reconstatare')>=0&&job.damageType==='auto')return;var cls=ix<SHELL_CUR?' done':ix===SHELL_CUR?' cur':'';h+='<div class="stC '+cls+'" onclick="goPhase('+ix+')" title="'+p.n+' '+nm(p)+'"></div>'});h+='</div><div class="stepC-meta"><span>'+cur.n+' '+nm(cur)+'</span><span>pasul '+cur.n+' / 07</span></div></div>';}
  h+='</div>';return h;
}

function render(){
  var ln=gL(),job=JOB;
  if(!job){document.getElementById('app').innerHTML='<div class="loading">'+T('noJob')+'<br><br><button class="btn btn-o" style="width:auto;padding:10px 24px;display:inline-flex" onclick="location.assign(\'index.html\')">'+T('openD')+'</button></div>';return}
  var cc=job.controlChecks||{};

  // Count progress
  var totalItems=0,doneItems=0,okItems=0,nokItems=0;
  CHECKLIST.forEach(function(cat){cat.items.forEach(function(it){totalItems++;var v=cc[it.id];if(v==='ok'){doneItems++;okItems++}else if(v==='nok'){doneItems++;nokItems++}else if(v==='na')doneItems++})});
  var pct=totalItems?Math.round(doneItems/totalItems*100):0;
  var allDone=doneItems===totalItems&&nokItems===0;

  var h=shellHtml(job,ln);

  // ── CONTROL állapot-szín: elvégezetlen=piros, elvégezve=zöld, hibák(NOK)=sárga ──
  var _cs=nokItems>0?'hiba':(allDone?'gata':'todo');
  var _ccol=_cs==='hiba'?'#E9A700':(_cs==='gata'?'#1E9D55':'#E11D2E');
  var _clab=_cs==='hiba'?('⚠️ DEFECTE ('+nokItems+')'):(_cs==='gata'?'✓ EFECTUAT':'● NEEFECTUAT');

  h+='<div class="company">SC SZKALICZKI SERVICE SRL · RO16250445 · Str. Petki David, Nr.27/A, Sangeorgiu de Mures · Tel: 0265318020</div>';

  // Vehicle
  h+='<div class="sec"><div class="sec-h"><div class="sec-t">'+T('vehicul')+'</div></div><div class="sec-bd"><div class="info-grid"><div class="info-f"><div class="info-l">'+T('plate')+'</div><div class="info-v mono" style="font-size:16px;font-weight:800">'+escH(job.plate||'—')+'</div></div><div class="info-f"><div class="info-l">'+T('proprietar')+'</div><div class="info-v">'+escH(job.proprietar||job.client||'—')+'</div></div></div><div class="info-grid" style="margin-top:6px"><div class="info-f"><div class="info-l">'+T('brand')+'</div><div class="info-v">'+escH(job.brand||job.auto||'—')+'</div></div><div class="info-f"><div class="info-l">'+T('year')+'</div><div class="info-v mono">'+escH(job.year||'—')+'</div></div></div></div></div>';

  // Progress bar
  h+='<div class="progress-bar" style="border-left:6px solid '+_ccol+';background:'+_ccol+'14"><div><div class="prog-label">'+T('progress')+'</div><div class="prog-val" style="color:'+_ccol+'">'+pct+'% · '+_clab+'</div></div><div class="prog-track"><div class="prog-fill" style="width:'+pct+'%;background:'+_ccol+'"></div></div><div style="font-size:11px;font-weight:700;color:'+_ccol+'">'+doneItems+'/'+totalItems+(nokItems?' · '+nokItems+' NOK':'')+'</div></div>';

  // Checklist categories
  CHECKLIST.forEach(function(cat){
    var catDone=0,catTotal=cat.items.length,catNok=0;
    cat.items.forEach(function(it){var v=cc[it.id];if(v)catDone++;if(v==='nok')catNok++});
    var badgeCls=catDone===catTotal&&catNok===0?'cb-ok':catDone>0?'cb-pt':'cb-nd';
    h+='<div class="chk-cat"><div class="chk-cat-h">'+cat.cat+'<span class="chk-cat-badge '+badgeCls+'">'+catDone+'/'+catTotal+(catNok?' · '+catNok+' NOK':'')+'</span></div>';
    cat.items.forEach(function(it){
      var v=cc[it.id]||'';
      h+='<div class="chk-item"><div class="chk-text">'+it.text+'</div><div class="chk-3btn"><div class="c3 c3-ok '+(v==='ok'?'on':'')+'" onclick="setChk(\''+it.id+'\',\'ok\')">'+T('ok')+'</div><div class="c3 c3-nok '+(v==='nok'?'on':'')+'" onclick="setChk(\''+it.id+'\',\'nok\')">'+T('nok')+'</div><div class="c3 c3-na '+(v==='na'?'on':'')+'" onclick="setChk(\''+it.id+'\',\'na\')">'+T('na')+'</div></div></div>';
      if(v==='nok'){h+='<div style="padding:0 14px 8px"><textarea class="chk-note" placeholder="Observatii NOK..." onchange="setChkNote(\''+it.id+'\',this.value)">'+(cc[it.id+'_note']||'')+'</textarea></div>'}
    });
    h+='</div>';
  });

  // Központi workflow-állapot szinkron (a modul innen olvassa a kontroll eredményét)
  if(window.RPWWorkflow){
    RPWWorkflow.migrateJob(job);
    if(!job.control)job.control={};
    job.control.allDone=allDone;
    job.control.lastResult=nokItems>0?'nok':(allDone?'ok':null);
  }
  var _openRw=(window.RPWWorkflow?RPWWorkflow.openReworks(job):[]);

  // NOK → kötelező javítási ciklus (rework), NEM lehet csak továbbengedni
  if(nokItems>0){
    h+='<div class="chk-cat" style="border:2px solid #E11D2E"><div class="chk-cat-h" style="color:#E11D2E">'+T('reworkTitle')+'</div>';
    h+='<div style="padding:8px 14px"><div style="font-size:12px;font-weight:700;margin-bottom:6px">'+T('reworkQ')+'</div>';
    h+='<input id="rwDesc" class="chk-note" placeholder="'+T('reworkDesc')+'" style="width:100%;margin-bottom:6px"><input id="rwWho" class="chk-note" placeholder="'+T('reworkAssign')+'" style="width:100%;margin-bottom:8px">';
    h+='<div style="display:flex;flex-wrap:wrap;gap:6px">';
    h+='<button class="btn btn-o" onclick="mkRework(4)">'+T('toLakatos')+'</button>';
    h+='<button class="btn btn-o" onclick="mkRework(5)">'+T('toFesto')+'</button>';
    h+='<button class="btn btn-o" onclick="mkRework(4,\'other\')">'+T('toOther')+'</button>';
    h+='<button class="btn btn-o" onclick="mkRework(0,\'manager\')">'+T('toManager')+'</button>';
    h+='</div></div></div>';
  }

  // Nyitott javítások listája + „ismételt kontroll" figyelmeztetés
  if(_openRw.length){
    h+='<div class="chk-cat"><div class="chk-cat-h">'+T('reworkOpen')+' ('+_openRw.length+')</div>';
    _openRw.forEach(function(r){h+='<div class="chk-item"><div class="chk-text">#'+r.id+' → '+(r.sourcePhase?('F'+r.sourcePhase):'manager')+' · '+(r.description||r.category||'')+(r.assignedTo?(' · '+r.assignedTo):'')+'</div></div>';});
    h+='<div style="padding:6px 14px;color:#E9A700;font-weight:700;font-size:12px">'+T('reControl')+'</div></div>';
  }

  // Actions — a továbblépés a KÖZPONTI modulból engedélyezett (NOK / nyitott rework → tiltva)
  var _canAdv=(window.RPWWorkflow?RPWWorkflow.canCompletePhase(job,6).ok:(allDone));
  h+='<div style="padding:10px 16px;display:flex;gap:8px"><button class="btn btn-o" onclick="window.print()" style="flex:1">'+T('print')+'</button><button class="btn '+(_canAdv?'btn-g':'btn-o')+'" onclick="advPh()" style="flex:1;'+(_canAdv?'':'opacity:.5')+'" '+(_canAdv?'':'disabled')+'>'+T('advance')+'</button></div>';

  h+='<div class="bpad"></div>';
  if(S.ts)h+='<div class="toast '+(S.te?'err':'')+'">'+S.ts+'</div>';
  document.getElementById('app').innerHTML=h;
}

window.setChk=async function(id,val){
  if(!JOB.controlChecks)JOB.controlChecks={};
  JOB.controlChecks[id]=JOB.controlChecks[id]===val?'':val;
  await saveJ();render();
};
window.setChkNote=async function(id,val){
  if(!JOB.controlChecks)JOB.controlChecks={};
  JOB.controlChecks[id+'_note']=val;
  await saveJ();
};
// NOK → javítási ciklus indítása (érvényes rework a célfázisra, megerősített mentéssel)
window.mkRework=async function(targetPhase,mode){
  if(!JOB)return;var _ln=gL();
  var d=document.getElementById('rwDesc'),w=document.getElementById('rwWho');
  var desc=(d&&d.value||'').trim(), who=(w&&w.value||'').trim();
  var ctrl=prompt(T('ctrlNamePrompt'),'');
  if(ctrl===null)return;
  var category=(mode==='manager'?'manager':(mode==='other'?'other':(targetPhase===5?'vopsitorie':'tinichigerie')));
  RPWWorkflow.migrateJob(JOB);
  if(!JOB.control)JOB.control={};
  JOB.control.lastResult='nok'; JOB.control.lastAt=new Date().toISOString(); JOB.control.lastBy=ctrl;
  var res=await RPWWorkflow.commitCriticalTransition(JOB, function(){
    return RPWWorkflow.createRework(JOB,{ category:category, targetPhase:(mode==='manager'?6:targetPhase),
      description:desc, assignedTo:who, createdBy:(ctrl||'').trim(), seed:(JOB.rework?JOB.rework.length:0) });
  }, {save:function(){return RPWSave.commitConfirmed(sb,JOB);}});
  if(!res.ok){
    if(res.notSynced){ toast(RPWWorkflow.t('wf_saved_not_synced',_ln),1); render(); return; }
    var errs=(res.result&&res.result.errors)||[];
    toast(errs.map(function(r){return RPWWorkflow.t(r,_ln);}).join('; ')||'?',1); return;
  }
  toast(T('reworkSent'));render();
};
window.advPh=async function(){
  if(!JOB)return;var _ln=gL();
  RPWWorkflow.migrateJob(JOB);
  var cc=JOB.controlChecks||{},totalItems=0,doneItems=0,nokItems=0;
  CHECKLIST.forEach(function(cat){cat.items.forEach(function(it){totalItems++;var v=cc[it.id];if(v)doneItems++;if(v==='nok')nokItems++})});
  if(!JOB.control)JOB.control={};
  JOB.control.allDone=(doneItems===totalItems && nokItems===0);
  JOB.control.lastResult=nokItems>0?'nok':(JOB.control.allDone?'ok':null);
  JOB.control.lastAt=new Date().toISOString();
  var res=await RPWWorkflow.commitCriticalTransition(JOB, function(){
    return RPWWorkflow.completePhase(JOB,6,{actor:'control'});
  }, {save:function(){return RPWSave.commitConfirmed(sb,JOB);}});
  if(!res.ok){
    if(res.notSynced){ toast(RPWWorkflow.t('wf_saved_not_synced',_ln),1); render(); return; }
    var errs=(res.result&&(res.result.errors||res.result.missing))||[];
    toast(errs.map(function(r){return RPWWorkflow.t(r,_ln);}).join('; ')||T('incomplete'),1); return;
  }
  toast(T('saved'));
  setTimeout(function(){location.assign('rpw-dosar.html?job='+JOB.id)},1500);
};

loadJob();
</script>
<script>/* RPW központi workflow-őr — fázisbelépés + állapotsáv */try{RPWWorkflow.installPageGuard({phase:6});}catch(e){}</script>
</body>
