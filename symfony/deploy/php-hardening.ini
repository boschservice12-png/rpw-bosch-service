; RPW — PHP-keményítés (1. réteg). Helye: /etc/php/8.3/fpm/conf.d/99-rpw.ini
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
allow_url_include = Off
file_uploads = Off            ; a fájlok a tárolókapun át jönnek, nem PHP-feltöltésként
post_max_size = 16M
upload_max_filesize = 1M
max_execution_time = 90       ; az AI-hívás (OCR) ennyit kaphat
memory_limit = 256M
session.use_strict_mode = 1   ; a backend nem használ PHP-sessiont; ha mégis, szigorúan
disable_functions = exec,passthru,shell_exec,system,popen,pcntl_exec
; proc_open marad: a pg_dump mentés ezt használja
opcache.enable = 1
opcache.validate_timestamps = 0   ; élesben a kód csak telepítéskor változik
