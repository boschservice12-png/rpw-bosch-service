; GENERÁLT: deploy/configure.sh — az RPW saját php-fpm készlete (saját felhasználó, csak a Caddy éri el).
; A keményítés ITT van, nem a globális php.ini-ben: csak erre a készletre vonatkozik.
[rpw]
user = rpw
group = rpw
listen = /run/php/rpw.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 1000
; az AI-hívás (OCR) ennyit kaphat
request_terminate_timeout = 90s

catch_workers_output = yes
decorate_workers_output = no

php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_flag[display_startup_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[allow_url_include] = off
; a fájlok a tárolókapun át jönnek (aláírt URL, nyers törzs), nem PHP-feltöltésként
php_admin_flag[file_uploads] = off
; a Caddy után a második zár: a legnagyobb kérés (helyi feltöltés, 25 MB) + tartalék
php_admin_value[post_max_size] = 26M
php_admin_value[max_execution_time] = 90
php_admin_value[memory_limit] = 256M
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,popen,pcntl_exec
php_admin_value[date.timezone] = Europe/Bucharest
php_admin_value[open_basedir] = __RPW_HOME__:/tmp:/usr/share/zoneinfo:/etc/ssl:/usr/share/ca-certificates
; telepítéskor a php-fpm reload üríti az opcache-t → nem kell fájlonként ellenőrizni
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[opcache.memory_consumption] = 128
php_admin_value[realpath_cache_ttl] = 600
