# RPW — a var/log/security-prod-*.log JSON-sorai (5. réteg → 1. réteg).
# Kizárást kiváltó események: rossz PIN, zárolás, zárolt fiók próbálgatása,
# idegen eredetű írókérés. A sikeres belépés NEM.
[Definition]
failregex = "event":"(?:bad_pin|account_locked|login_while_locked|origin_blocked|login_unknown_employee)","ip":"<HOST>"
ignoreregex =
datepattern = "datetime":"%%Y-%%m-%%dT%%H:%%M:%%S
