# RPW — IP-kizárás. Egy műhely MINDEN dolgozója egy IP-ről jön, ezért a küszöb
# magas (a dolgozónkénti 10/15 perc PIN-zár MELLETT): 30 hibás esemény / 10 perc
# → 1 óra kizárás. A műhely saját IP-jét az ignoreip-be érdemes felvenni.
[rpw]
enabled  = true
port     = http,https
filter   = rpw
logpath  = /srv/rpw/symfony/var/log/security-prod-*.log
maxretry = 30
findtime = 10m
bantime  = 1h
# ignoreip = 127.0.0.1/8 <a műhely fix IP-je>

[sshd]
enabled  = true
maxretry = 5
bantime  = 1h
