framework:
    secret: '%env(APP_SECRET)%'
    # Állapotmentes API: nincs PHP-session.
    session: false
    http_method_override: false
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'

    rate_limiter:
        # IP-alapú fék a belépésre (a dolgozónkénti 10/15 perc zár MELLETT)
        login:
            policy: sliding_window
            limit: 30
            interval: '15 minutes'
            lock_factory: null

when@test:
    framework:
        test: true
        rate_limiter:
            login:
                policy: sliding_window
                limit: 100000
                interval: '15 minutes'
                lock_factory: null
