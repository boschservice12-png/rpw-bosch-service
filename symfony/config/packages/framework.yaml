framework:
    secret: '%env(APP_SECRET)%'
    # Állapotmentes API: nincs PHP-session.
    session: false
    http_method_override: false
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'

    rate_limiter:
        # IP-alapú fék a belépésre — a dolgozónkénti zár (10 rossz PIN / 15 perc) MELLETT.
        # Egy műhelyben MINDENKI ugyanarról az IP-ről jön (közös hálózat), ezért a
        # korlát a teljes csapat műszakkezdését bírja; a próbálgatás ellen a
        # dolgozónkénti zár véd. Állítható: RPW_LOGIN_IP_LIMIT.
        login:
            policy: sliding_window
            limit: '%env(int:default:rpw.login_ip_limit:RPW_LOGIN_IP_LIMIT)%'
            interval: '15 minutes'
            lock_factory: null
        # AI-hívások (OCR, besorolás) — fizetős API, a durva visszaélés ellen
        ai:
            policy: sliding_window
            limit: 60
            interval: '1 minute'
            lock_factory: null
        mail:
            policy: sliding_window
            limit: 20
            interval: '1 minute'
            lock_factory: null

when@test:
    framework:
        test: true
        # a tesztekben semmi nem megy ki a hálózatra; a fotótár-kérések egy memóriabeli S3-at érnek el
        http_client:
            mock_response_factory: App\Tests\Support\FakeS3
        rate_limiter:
            login:
                policy: sliding_window
                limit: 100000
                interval: '15 minutes'
                lock_factory: null
