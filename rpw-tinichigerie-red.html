<div id="rpw-sync" style="position:fixed;bottom:10px;right:12px;z-index:300;font:600 11px system-ui,Arial;background:#fff;border:1px solid #E8EBEF;border-radius:8px;padding:5px 10px;box-shadow:0 2px 8px rgba(0,0,0,.08);opacity:0;transition:opacity .2s"></div>
<div id="app"><div class="loading">Se incarca...</div></div>
<script>
if(!window.RPW_CFG){(document.getElementById('app')||document.body).innerHTML='<div style="padding:40px;text-align:center;font-family:system-ui,Arial"><div style="font-size:40px">&#9888;&#65039;</div><div style="font-size:18px;font-weight:800;color:#C81E33;margin:12px 0 6px">Configurație lipsă</div><div style="color:#3F4956;font-size:14px;line-height:1.6">rpw-config.js nu s-a încărcat (sau rulează dintr-o copie locală file://).<br>Deschide sistemul live.</div></div>';throw new Error('RPW_CFG missing');}
if(window.RPWAuth){try{RPWAuth.guard();}catch(e){}}
var SB_URL=RPW_CFG.SB_URL;
var SB_KEY=RPW_CFG.SB_KEY;
var sb=supabase.createClient(SB_URL,SB_KEY);
/* PHASE 1: látható szinkron-állapot + robusztus mentő (rpw-save.js) */
function rpwSyncLabel(st){var m={saving_local:['Salvare…','#6B7280'],syncing:['Sincronizare…','#2A6FDB'],synced:['✓ Salvat pe server','#1E9D55'],offline:['⚠ Offline – salvat local','#A6701F'],retry:['↻ Reîncercare…','#A6701F'],failed:['✗ Eșec salvare – reîncearcă','#C81E33'],permission:['✗ Fără permisiune','#C81E33'],conflict:['⚠ Conflict de date','#C81E33'],auth:['✗ Autentificare','#C81E33'],idle:['','#6B7280']};return m[st]||[st,'#6B7280'];}
function onSyncState(st){var el=document.getElementById('rpw-sync');if(el){var l=rpwSyncLabel(st);el.textContent=l[0];el.style.color=l[1];el.style.opacity=l[0]?'1':'0';if(st==='synced'){setTimeout(function(){if(el&&el.textContent===l[0])el.style.opacity='0'},2000)}}var cb=document.getElementById('rpw-conflict');if(st==='conflict'){if(!cb){cb=document.createElement('div');cb.id='rpw-conflict';cb.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,Arial';cb.innerHTML='<div style="max-width:360px;background:#fff;border-radius:12px;padding:22px;text-align:center"><div style="font-size:34px">\u26A0\uFE0F</div><div style="font-size:17px;font-weight:800;color:#C81E33;margin:8px 0">Conflict de date</div><div style="font-size:13px;color:#3F4956;line-height:1.6">Alt utilizator a modificat aceast\u0103 fi\u0219\u0103. Modificarea ta local\u0103 este p\u0103strat\u0103. Re\u00EEncarc\u0103 pentru versiunea de pe server.</div><button onclick="location.reload()" style="margin-top:16px;background:#E11D2E;color:#fff;border:none;border-radius:9px;padding:11px 20px;font-weight:800;cursor:pointer">Re\u00EEncarc\u0103</button></div>';document.body.appendChild(cb);}}else if(cb){cb.remove();}}
var SAVER=(window.RPWSave&&RPWSave.createSaver)?RPWSave.createSaver({sb:sb,onState:onSyncState}):null;
if(SAVER&&window.RPWSave&&RPWSave.bindBeforeUnload)RPWSave.bindBeforeUnload(SAVER,'Există modificări nesincronizate.');
if(typeof saveJ==='function'){var _saveJ_orig=saveJ;saveJ=function(){if(typeof JOB==='undefined'||!JOB)return Promise.resolve();return SAVER?SAVER.save(JOB):_saveJ_orig();};}
if(typeof saveJob==='function'){var _saveJob_orig=saveJob;saveJob=function(job){if(!job)return Promise.resolve();return SAVER?SAVER.save(job):_saveJob_orig(job);};}
var JOB=null;
var S={ts:null,te:0};

function gJI(){return new URLSearchParams(location.search).get('job')}
async function loadJob(){
  var jid=gJI();if(!jid){render();return}
  var cached=localStorage.getItem('rpw_job_'+jid);
  if(cached){try{JOB=JSON.parse(cached);if(!JOB.phases)JOB.phases={};for(var p=1;p<=7;p++){if(!JOB.phases[p])JOB.phases[p]={status:"pending"}};render()}catch(e){}}
  try{
    var res=await RPWDb.getRow(sb,jid);
    if(res.error)throw res.error;
    var _lts=0,_sts=0;try{_lts=Date.parse(localStorage.getItem('rpw_job_ts_'+jid)||0)||0;_sts=Date.parse(res.data.updated_at||0)||0}catch(e){}
    if(!(JOB&&_lts&&_sts<=_lts)){JOB=res.data.data;if(JOB&&res.data.version!=null)JOB.version=res.data.version;if(!JOB.phases)JOB.phases={};for(var p=1;p<=7;p++){if(!JOB.phases[p])JOB.phases[p]={status:"pending"}};
    try{localStorage.setItem('rpw_job_'+jid,JSON.stringify(JOB));localStorage.setItem('rpw_job_ts_'+jid,res.data.updated_at||new Date().toISOString())}catch(e){}}
    try{localStorage.setItem('rpw_job_'+jid,JSON.stringify(JOB))}catch(e){}
    /* nincs auto-mentes betolteskor */
  }catch(e){if(!JOB)JOB=null}
  render();
}
var _saveTimer=null;
async function saveJ(){
  if(!JOB)return;
  try{localStorage.setItem('rpw_job_'+JOB.id,JSON.stringify(JOB));localStorage.setItem('rpw_job_ts_'+JOB.id,new Date().toISOString())}catch(e){}
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(async function(){
    try{await RPWDb.patch(sb,JOB)}
    catch(e){console.error('Save:',e)}
  },500);
}

var DEF_HRS={replace:2,fix:3,dez:1,centrat:1};
var EL_NAMES={fb:'Bara fata',rb:'Bara spate',hood:'Capota',trunk:'Portbagaj',roof:'Plafon',fl_f:'Aripa stg fata',fr_f:'Aripa dr fata',rl_f:'Aripa stg spate',rr_f:'Aripa dr spate',fl_d:'Usa stg fata',fr_d:'Usa dr fata',rl_d:'Usa stg spate',rr_d:'Usa dr spate',l_s:'Prag stg',r_s:'Prag dr',l_m:'Ogl. stg',r_m:'Ogl. dr',a_l:'Stalp A stg',a_r:'Stalp A dr',b_l:'Stalp B stg',b_r:'Stalp B dr',c_l:'Stalp C stg',c_r:'Stalp C dr'};
var TIN_OPS={inlocuire:1,demontat:1,dezasamblat:1,reparatie:1};

function buildBodyRows(){
  var rows=[],seen={};
  // TERMELÉS-KAPU: ha van evaluare-státusz és NEM 'accepted', a munka még nem megy termelésbe (régi, státusz nélküli dossziek nem érintettek)
  if(JOB&&JOB.evalData&&JOB.evalData.status&&JOB.evalData.status!=='accepted')return rows;
  function add(key,r,src){
    if(seen[key]||!TIN_OPS[r.op])return;seen[key]=1;
    var bt=mapBodyType(r.op);
    var nm=r.name||EL_NAMES[r.elKey]||r.elKey||'';
    rows.push({key:key,name:nm,src:src,workType:r.op,bodyType:bt,hours:(r.hours!=null?r.hours:(DEF_HRS[bt]||2)),note:r.note||''});
  }
  var ed=JOB.evalData||{};
  var cR=ed.comanda||[];for(var x=0;x<cR.length;x++)add('c_'+(cR[x].id||x),cR[x],'evaluare');
  var sR=ed.suplimentare||[];for(var x=0;x<sR.length;x++)add('s_'+(sR[x].id||x),sR[x],'reconstatare');
  return rows;
}

function syncBodyRows(){
  if(!JOB)return;
  var gen=buildBodyRows(),old=JOB.bodyRows||[],byKey={};
  old.forEach(function(r){byKey[r.key]=r});
  var merged=[];
  gen.forEach(function(g){var o=byKey[g.key];if(o){o.name=g.name;o.workType=g.workType;o.src=g.src;merged.push(o)}else merged.push(g)});
  old.forEach(function(r){if(r.src==='manual')merged.push(r)});
  JOB.bodyRows=merged;
}

function mapBodyType(w){
  if(!w)return 'fix';
  var wl=w.toLowerCase();
  if(wl.indexOf('inlocui')>=0||wl==='replace'||wl==='new'||wl==='nou')return 'replace';
  if(wl.indexOf('dezas')>=0||wl==='dez')return 'dez';
  if(wl.indexOf('centr')>=0||wl==='centrat')return 'centrat';
  if(wl.indexOf('uniform')>=0||wl==='uni')return 'fix';
  if(wl.indexOf('repar')>=0||wl==='fix'||wl==='old'||wl==='vechi')return 'fix';
  return 'fix';
}

function toast(m,e){S.ts=m;S.te=e?1:0;render();setTimeout(function(){S.ts=null;render()},3000)}

secConst:{ro:'CONSTATARE',en:'ASSESSMENT',hu:'FELMERES'},secReconst:{ro:'RECONSTATARE',en:'RE-ASSESSMENT',hu:'UJRAFELMERES'},secUpsell:{ro:'UPSELL / AFTERSALES',en:'UPSELL / AFTERSALES',hu:'UPSELL / AFTERSALES'},

window.waBody=function(){
  if(!JOB)return;
  var rows=JOB.bodyRows||[],appr=JOB.bodyApproval||{};
  var phone=(JOB.phone||'').replace(/[^0-9+]/g,'');
  if(!phone||phone.length<6){phone=prompt('Numar telefon:','');if(!phone)return}
  phone=phone.replace(/[^0-9]/g,'');
  if(phone.length&&phone[0]==='0')phone='40'+phone.slice(1);
  var msg='*RedAssistance — Comanda Tinichigerie*\n\n';
  msg+='🚗 '+(JOB.brand||JOB.auto||'')+' · '+(JOB.plate||'')+'\n';
  msg+='Client: '+(JOB.proprietar||JOB.client||'')+'\n';
  msg+='Nr: '+(JOB.number||JOB.id)+'\n';
  var totalHrs=0,cnt=0;
  function addSec(title,srcRows,approved){
    if(!srcRows.length)return;
    msg+='\n*'+title+'* '+(approved?'✅':'❌')+'\n';
    for(var x=0;x<srcRows.length;x++){
      var r=srcRows[x];if(!approved)continue;cnt++;
      var h=parseFloat(r.hours)||0;totalHrs+=h;
      var tL=r.bodyType==='replace'?'INLOCUIRE':r.bodyType==='dez'?'DEZAS.':r.bodyType==='centrat'?'CENTRAT':'REPARATIE';
      msg+='  '+cnt+'. *'+r.name+'* ['+tL+'] — '+h+' ore'+(r.note?' ('+r.note+')':'')+'\n';
    }
  }
  var cR=[],rR=[],uR=[];
  rows.forEach(function(r){if(r.src==='evaluare')cR.push(r);else if(r.src==='reconstatare')rR.push(r);else if(r.src==='aftersales')uR.push(r);else cR.push(r)});
  addSec('CONSTATARE',cR,true);
  addSec('RECONSTATARE',rR,!!appr.reconst);
  addSec('UPSELL',uR,!!appr.upsell);
  msg+='\n*TOTAL: '+totalHrs.toFixed(1)+' ore tinichigerie ('+cnt+' elemente)*\n\n';
  msg+='📞 0265318020\n📍 SC SZKALICZKI SERVICE SRL';
  var _waA=document.createElement('a');_waA.href='https://wa.me/'+phone+'?text='+encodeURIComponent(msg);_waA.target='_blank';_waA.rel='noopener';document.body.appendChild(_waA);_waA.click();setTimeout(function(){document.body.removeChild(_waA)},100);
};

  var note=prompt(T('rwNotePrompt'),'');
  if(note===null)return;
  var res=await RPWWorkflow.commitCriticalTransition(JOB, function(){
    return RPWWorkflow.resolveRework(JOB,id,{resolvedBy:who,resolutionNote:note});
  }, {save:function(){return RPWSave.commitConfirmed(sb,JOB);}});
  if(!res.ok){
    if(res.notSynced){ toast(RPWWorkflow.t('wf_saved_not_synced',_ln),1); render(); return; }
    var errs=(res.result&&res.result.errors)||[];
    toast(errs.map(function(r){return RPWWorkflow.t(r,_ln);}).join('; ')||'?',1); return;
  }
  toast(T('rwResolved'));render();
};
// Termelésbe engedett sorok completed-jelölése (valós végrehajtói név)
window.setDone=async function(idx){
  if(!JOB||!JOB.bodyRows||!JOB.bodyRows[idx])return;
  var r=JOB.bodyRows[idx];
  if(r.completed){ r.completed=false; r.completedBy=null; r.completedAt=null; }
  else{
    var who=prompt(T('execPrompt'),r.completedBy||'');
    if(who===null)return;
    if(!RPWWorkflow.isRealPerson(who)){ toast(RPWWorkflow.t('wf_rw_placeholder',(typeof gL==='function'?gL():'ro')),1); return; }
    r.completed=true; r.completedBy=who.trim(); r.completedAt=new Date().toISOString();
  }
  syncProduction();await saveJ();render();
};
// A termelési (végrehajtandó) lista előállítása a KÖZPONTI modul számára
function syncProduction(){
  if(!JOB)return;
  var rows=JOB.bodyRows||[],appr=JOB.bodyApproval||{};
  var out=[];
  rows.forEach(function(r){
    var inProd = (r.src==='evaluare'||r.src==='manual') || (r.src==='reconstatare'&&appr.reconst) || (r.src==='aftersales'&&appr.upsell);
    if(!inProd)return;
    out.push({name:r.name||'',op:r.bodyType||r.workType||'',hours:parseFloat(r.hours)||0,approved:true,
              completed:!!r.completed,completedBy:r.completedBy||'',completedAt:r.completedAt||null,notRequired:!!r.notRequired});
  });
  if(!JOB.production)JOB.production={};
  JOB.production.body=out;
}
window.advPh=async function(){
  if(!JOB)return;
  var _ln=(typeof gL==='function')?gL():'ro';
  RPWWorkflow.migrateJob(JOB);
  syncProduction();
  var noWork=!RPWWorkflow.hasExecutableWork(JOB,4);
  var res=await RPWWorkflow.commitCriticalTransition(JOB, function(){
    // Üres műhely → dokumentált SKIP (no_bodywork), nem „done"
    return noWork ? RPWWorkflow.skipPhase(JOB,4,'no_bodywork',{actor:'tinichigerie'})
                  : RPWWorkflow.completePhase(JOB,4,{actor:'tinichigerie'});
  }, {save:function(){return RPWSave.commitConfirmed(sb,JOB);}});
  if(!res.ok){
    if(res.notSynced){ toast(RPWWorkflow.t('wf_saved_not_synced',_ln),1); render(); return; }
    var errs=(res.result&&(res.result.errors||res.result.missing))||[];
    toast(errs.map(function(r){return RPWWorkflow.t(r,_ln);}).join('; ')||T('incomplete'),1); return;
  }
  toast(noWork?T('skipNoWork'):T('saved'));
  setTimeout(function(){location.assign('rpw-dosar.html?job='+JOB.id)},1500);
};

loadJob();
</script>
<script>/* RPW központi workflow-őr — fázisbelépés + állapotsáv */try{RPWWorkflow.installPageGuard({phase:4});}catch(e){}</script>
