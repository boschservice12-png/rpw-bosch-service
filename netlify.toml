[build]
  functions = "functions"

# ── PHASE 2: biztonsági fejlécek + CSP ──
# Megjegyzés: a 'unsafe-inline' a script/style-nál EGYELŐRE marad, mert az app
# inline scripteket és inline onclick-eket használ. Ennek eltávolítása a #9 XSS-refaktor
# (inline handler → addEventListener) után lehetséges — akkor a CSP tovább szigorítható.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co https://api.anthropic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; frame-src 'none'; worker-src 'self'; upgrade-insecure-requests"

# ── 11 (v3) — CSP: mi változott és miért ─────────────────────────────
# HOZZÁADVA:  frame-src 'none'        — nincs beágyazott keret
#             worker-src 'self'       — csak saját worker
#             upgrade-insecure-requests
#             connect-src: api.anthropic.com (az OCR-hez)
# ELTÁVOLÍTVA: connect-src data: és blob: — ezek NEM kellenek
#             kapcsolathoz, csak img-src-hez, és tágították a felületet.
#
# ⚠ A `javascript:` URL-eket a CSP `script-src` önmagában NEM tiltja
# megbízhatóan minden böngészőben. Ezért a kódban is ellenőrizzük:
# lásd `openLB()` sémaellenőrzését a rpw-dosar.html-ben.
#
# ⚠ A 'unsafe-inline' MARAD a script-src-ben. Az alkalmazás inline
# scripteket és onclick kezelőket használ — 12 oldalon, több száz
# helyen. Eltávolítása nonce/hash bevezetését és a teljes inline
# handler-refaktort igényli. Amíg ez nincs meg, a 'unsafe-inline'
# eltávolítása MEGBÉNÍTANÁ az alkalmazást.
# A STAGING report-only fejléc (lentebb) méri, mi törne el.

# A funkciók (/.netlify/functions/*) SAJÁT CORS-fejléceiket adják (_shared.js allowlist),
# ezért itt NINCS globális Access-Control-Allow-Origin: * (a korábbi nyitott CORS megszűnt).


# ════════════════════════════════════════════════════════════════
#  AMI NEM MEHET KI A NYILVÁNOS SITE-RA
#  ----------------------------------------------------------------
#  Nincs `publish` könyvtár megadva, ezért a Netlify a repó GYÖKERÉT
#  szolgálja ki. A V4 óta itt fekszik a migrációk, a tesztek és a
#  biztonsági dokumentáció is — a `REMAINING-RISKS.md` kifejezetten
#  FELSOROLJA a nyitott réseket, a `_migrations/` pedig a teljes
#  jogosultsági modellt. Ezek nélkül a szabályok nélkül a site
#  élesítésének pillanatában letölthetők lennének.
#
#  `force = true`: a szabály a statikus fájl KISZOLGÁLÁSA ELŐTT fut.
#  A tartalom a 404-es lapé, a státusz 404 — nincs se tartalom,
#  se „létezik, de tiltott" visszajelzés.
# ════════════════════════════════════════════════════════════════
[[redirects]]
  from = "/_migrations/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_db/*"
  to = "/404.html"
  status = 404
  force = true

