# ════════════════════════════════════════════════════════════════
#  STAGING — CSP REPORT-ONLY
#  ----------------------------------------------------------------
#  Ez a SZIGORÚ cél-CSP, `Report-Only` módban: NEM blokkol semmit,
#  csak jelenti, mi sértené meg. Így mérhető, mennyi inline script
#  van még, mielőtt élesben bekapcsolnánk.
#
#  Lépések:
#    1. Ez a fejléc stagingen bekapcsolva marad 1-2 hétig
#    2. A jelentésekből kiderül, mely oldalak inline scriptjei törnek
#    3. Azok átalakítása addEventListener-re
#    4. Csak UTÁNA kerül a szigorú CSP az élő fejlécbe
#
#  ⚠ Élesben ellenőrzés nélkül NEM kapcsolható be.
# ════════════════════════════════════════════════════════════════
[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co https://api.anthropic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; frame-src 'none'"
